{% extends "base.html" %}

{% block title %}{{ page_title }} - Mirrarr{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="text-center">
        <h1 class="text-3xl font-bold text-white">{{ page_title }}</h1>
        <p class="mt-2 text-slate-400">Enable, disable, and reorder filesystem plugins.</p>
    </div>

    <div class="max-w-5xl mx-auto space-y-4">
        <div class="flex items-center justify-between text-sm text-slate-400 px-1">
            <span>Drag the handle in the loaded section to change load order.</span>
            <button
                hx-post="/plugins/reload"
                hx-target="#plugins-list"
                hx-swap="innerHTML"
                class="px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 transition-colors">
                Rescan plugins
            </button>
        </div>

        <div id="plugins-list">
            {% include 'partials/plugin_list.html' %}
        </div>
    </div>
</div>

<script>
    (function () {
        let draggedId = null;
        let isSaving = false;

        function rows() {
            return Array.from(document.querySelectorAll('#loaded-plugin-list-body [data-plugin-id]'));
        }

        function attachDragHandlers() {
            rows().forEach(row => {
                row.addEventListener('dragstart', function (event) {
                    draggedId = row.dataset.pluginId;
                    row.classList.add('opacity-60');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', draggedId);
                });

                row.addEventListener('dragend', function () {
                    row.classList.remove('opacity-60');
                    draggedId = null;
                });

                row.addEventListener('dragover', function (event) {
                    event.preventDefault();
                    event.dataTransfer.dropEffect = 'move';
                });

                row.addEventListener('drop', function (event) {
                    event.preventDefault();
                    const targetId = row.dataset.pluginId;
                    const sourceId = draggedId || event.dataTransfer.getData('text/plain');
                    if (!sourceId || sourceId === targetId) return;

                    const list = document.getElementById('loaded-plugin-list-body');
                    const sourceRow = document.querySelector('#loaded-plugin-list-body [data-plugin-id="' + CSS.escape(sourceId) + '"]');
                    const targetRow = document.querySelector('#loaded-plugin-list-body [data-plugin-id="' + CSS.escape(targetId) + '"]');
                    if (!list || !sourceRow || !targetRow) return;

                    const rect = targetRow.getBoundingClientRect();
                    const dropAfter = (event.clientY - rect.top) > rect.height / 2;
                    if (dropAfter) {
                        list.insertBefore(sourceRow, targetRow.nextSibling);
                    } else {
                        list.insertBefore(sourceRow, targetRow);
                    }

                    if (!isSaving) {
                        isSaving = true;
                        const order = rows().map(item => item.dataset.pluginId);
                        fetch('/plugins/reorder', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({order})
                        })
                            .then(response => response.text())
                            .then(html => {
                                const container = document.getElementById('plugins-list');
                                if (container) {
                                    container.innerHTML = html;
                                    if (window.htmx) htmx.process(container);
                                    attachDragHandlers();
                                }
                            })
                            .catch(error => {
                                console.error(error);
                                if (window.showToast) showToast('Failed to save plugin order', 'error');
                            })
                            .finally(() => {
                                isSaving = false;
                            });
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', attachDragHandlers);
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.target && event.target.id === 'plugins-list') {
                attachDragHandlers();
            }
        });
    })();
</script>
{% endblock %}
